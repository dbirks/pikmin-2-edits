[project]
name = "pikminlab"
version = "0.1.0"
description = "Local Dolphin dev loop for Pikmin 2 (GPVE01) modding"
requires-python = ">=3.11"
dependencies = [
  "pyyaml",
  "pyisotools",
  "dolphin-memory-engine",
  "pillow>=12.3.0",
  "imagequant>=1.1.5",
  "pyfastyaz0yay0",
]

[project.scripts]
pikminlab = "pikminlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pikminlab"]

[tool.uv.sources]
pyfastyaz0yay0 = { git = "https://github.com/LagoLunatic/PyFastYaz0Yay0.git", rev = "2adb8a8c00d98f98f245e0304094a0610203a82e" }

[dependency-groups]
dev = ["pytest"]
