[project]
name = "pikminlab"
version = "0.1.0"
description = "Local Dolphin dev loop for Pikmin 2 (GPVE01) modding"
requires-python = ">=3.11"
dependencies = [
  "pyyaml",
  "pyisotools",
  "dolphin-memory-engine",
  "pillow>=12.3.0",
  "imagequant>=1.1.5",
]

[project.scripts]
pikminlab = "pikminlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pikminlab"]

[dependency-groups]
dev = ["pytest"]
